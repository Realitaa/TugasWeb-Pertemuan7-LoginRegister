name: Test & Deploy (Git-FTP)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run PHPUnit & Build Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, curl, dom, libxml, json
          coverage: none

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          runtime: node@24
          cache: true
        env:
          pnpm_config_minimum_release_age: 0

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite assets
        run: pnpm run build

      - name: Run PHPUnit Tests
        run: ./vendor/bin/phpunit --colors=always

  deploy:
    name: Deploy to FTP via Git-FTP
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, curl, dom, libxml, json
          coverage: none

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          runtime: node@24
          cache: true
        env:
          pnpm_config_minimum_release_age: 0

      - name: Install Production Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite Production Assets
        run: pnpm run build

      - name: Install git-ftp
        run: |
          sudo apt-get update
          sudo apt-get install -y git-ftp

      - name: Deploy with git-ftp
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_URL: ${{ secrets.FTP_SERVER }}
        run: |
          git ftp push --auto-init --force --verbose \
            --user "$FTP_USER" \
            --passwd "$FTP_PASSWORD" \
            "$FTP_URL"
